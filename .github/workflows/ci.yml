name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::lintr, any::styler
          needs: check
      - name: Tests
        shell: bash
        run: Rscript -e 'testthat::test_local(reporter = testthat::CheckReporter$new())'
      - name: Lint
        shell: bash
        run: Rscript -e 'l <- lintr::lint_package(); for (x in l) cat(sprintf("%s:%d:%d: %s: [%s] %s\n", x$filename, x$line_number, x$column_number, x$type, x$linter, x$message), sep = ""); quit(status = as.integer(length(l) > 0))'
